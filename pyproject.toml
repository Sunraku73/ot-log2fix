[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otlog2fix"
version = "0.1.0"
description = "AI-powered log analyzer for OpenText Content Server & AppWorks"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Emilio"}]
keywords = ["opentext", "logs", "analysis", "redaction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Topic :: System :: Logging",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "openai>=1.40",
  "pydantic-settings>=2.4",
]

[project.urls]
Homepage = "https://github.com/Sunraku73/ot-log2fix"
Repository = "https://github.com/Sunraku73/ot-log2fix"
Issues = "https://github.com/Sunraku73/ot-log2fix/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "python-dotenv>=1"]

[project.scripts]
otlog2fix = "otlog2fix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otlog2fix = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
